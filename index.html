<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DTA 小红书工具</title>
  <style>
    :root{--bg:#f5f4f1;--card:#fff;--ink:#17191d;--muted:#69707b;--line:#dddcd7;--red:#dc3d56;--blue:#315d9f}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f8f5ef,#f1f4f5);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    main{width:min(1040px,calc(100% - 32px));margin:auto;padding:72px 0}.eyebrow{color:var(--red);font-weight:750;letter-spacing:.08em}h1{margin:8px 0 10px;font-size:clamp(34px,6vw,64px);line-height:1.08}.lead{max-width:700px;color:var(--muted);font-size:18px;margin:0 0 38px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.tool{display:flex;min-height:250px;flex-direction:column;padding:28px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:inherit;text-decoration:none;box-shadow:0 14px 45px #2221;transition:.18s ease}.tool:hover{transform:translateY(-3px);border-color:#bbb;box-shadow:0 20px 55px #2222}.icon{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:#fff0f2;color:var(--red);font-size:24px;font-weight:800}.tool.review .icon{background:#eef4ff;color:var(--blue)}h2{margin:24px 0 7px;font-size:24px}.desc{color:var(--muted);margin:0}.go{margin-top:auto;padding-top:24px;font-weight:750;color:var(--red)}.review .go{color:var(--blue)}footer{margin-top:28px;color:var(--muted);font-size:13px}
    @media(max-width:720px){main{padding:42px 0}.grid{grid-template-columns:1fr}.tool{min-height:220px}}
  </style>
</head>
<body><main>
  <div class="eyebrow">DTA · XIAOHONGSHU</div>
  <h1>小红书工具</h1>
  <p class="lead">统一进入团队的小红书辅助工具。两个功能彼此独立，数据与审核状态分别保存。</p>
  <section class="grid">
    <a class="tool" href="checklist/">
      <div class="icon">✓</div>
      <h2>达人合作 Checklist</h2>
      <p class="desc">按笔记类型逐项检查报备内容，提交并查看团队历史记录。</p>
      <div class="go">进入 Checklist →</div>
    </a>
    <a class="tool review" href="review/">
      <div class="icon">↗</div>
      <h2>自制潜力爆文审核台</h2>
      <p class="desc">筛选近期潜力笔记，查看指标、评论与 AI 观察，完成四态人工审核。</p>
      <div class="go">进入审核台 →</div>
    </a>
  </section>
  <footer>仅用于 DTA 团队内部业务协作。</footer>
</main></body>
</html>
