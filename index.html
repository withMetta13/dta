<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DTA 小红书报备笔记优化 Checklist</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #202027;
      --muted: #6d6974;
      --line: #e7ded5;
      --panel: #fffdf9;
      --panel-strong: #fff7ed;
      --red: #dd4d5c;
      --rose: #b64f74;
      --green: #487e66;
      --blue: #416c9f;
      --gold: #aa7a25;
      --shadow: 0 18px 50px rgba(55, 39, 23, .10);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(115deg, rgba(255, 247, 237, .86) 0 42%, rgba(241, 248, 246, .88) 42% 70%, rgba(255, 244, 245, .72) 70%),
        linear-gradient(135deg, #fbf7f0 0%, #f4f0eb 42%, #eef4f1 100%);
      color: var(--ink);
      font: 16px/1.62 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button, input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .shell {
      width: min(1360px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(360px, .82fr);
      gap: 22px;
      align-items: stretch;
      min-height: 308px;
      margin-bottom: 18px;
    }

    .hero-copy {
      position: relative;
      overflow: hidden;
      padding: 36px;
      border: 1px solid rgba(172, 139, 104, .24);
      border-radius: var(--radius);
      background:
        linear-gradient(130deg, rgba(255, 253, 249, .94), rgba(255, 253, 249, .78)),
        url("data:image/svg+xml,%3Csvg width='720' height='380' viewBox='0 0 720 380' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='720' height='380' fill='%23fff7ed'/%3E%3Cg fill='none' stroke='%23dd4d5c' stroke-width='2' opacity='.22'%3E%3Cpath d='M33 85c74-45 132-45 174 0s100 45 174 0 132-45 174 0 100 45 174 0'/%3E%3Cpath d='M-15 178c74-45 132-45 174 0s100 45 174 0 132-45 174 0 100 45 174 0'/%3E%3Cpath d='M28 270c74-45 132-45 174 0s100 45 174 0 132-45 174 0 100 45 174 0'/%3E%3C/g%3E%3Cg opacity='.74'%3E%3Crect x='470' y='42' width='146' height='234' rx='22' fill='%23ffffff' stroke='%23d5c7b9'/%3E%3Crect x='493' y='70' width='100' height='128' rx='12' fill='%23f0d8de'/%3E%3Cpath d='M515 55h56' stroke='%23202027' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M506 218h74M506 238h48' stroke='%23a66b76' stroke-width='8' stroke-linecap='round'/%3E%3Ccircle cx='500' cy='287' r='10' fill='%23202027'/%3E%3Ccircle cx='588' cy='287' r='10' fill='%23202027'/%3E%3Crect x='92' y='78' width='240' height='174' rx='18' fill='%23ffffff' stroke='%23d5c7b9'/%3E%3Cpath d='M122 120h142M122 155h182M122 190h120' stroke='%23416c9f' stroke-width='13' stroke-linecap='round' opacity='.8'/%3E%3Cpath d='M305 95l22 23 41-45' stroke='%23487e66' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E");
      background-size: cover;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      padding: 4px 10px;
      border: 1px solid rgba(221, 77, 92, .24);
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
      color: var(--rose);
      font-size: 13px;
      font-weight: 750;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: var(--red);
      box-shadow: 0 0 0 5px rgba(221, 77, 92, .12);
    }

    h1 {
      max-width: 760px;
      margin: 22px 0 14px;
      font-size: clamp(34px, 4.8vw, 66px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .lead {
      max-width: 760px;
      margin: 0;
      color: #504d57;
      font-size: 18px;
    }

    .hero-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 28px;
      max-width: 760px;
    }

    .metric {
      min-height: 86px;
      padding: 13px 14px;
      border: 1px solid rgba(172, 139, 104, .24);
      border-radius: var(--radius);
      background: rgba(255, 253, 249, .82);
      backdrop-filter: blur(10px);
    }

    .metric strong {
      display: block;
      font-size: 28px;
      line-height: 1.1;
    }

    .metric span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .visual-panel {
      position: relative;
      overflow: hidden;
      min-height: 308px;
      padding: 22px;
      border: 1px solid rgba(172, 139, 104, .24);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(32, 32, 39, .96), rgba(39, 61, 55, .96)),
        #202027;
      box-shadow: var(--shadow);
      color: #fffdf9;
    }

    .hero-art {
      position: relative;
      height: 100%;
      min-height: 396px;
      isolation: isolate;
    }

    .hero-art::before {
      content: "";
      position: absolute;
      inset: 18px 20px auto auto;
      width: 188px;
      height: 188px;
      border-radius: 999px;
      background: rgba(255, 253, 249, .12);
      filter: blur(2px);
    }

    .art-card {
      position: absolute;
      border: 1px solid rgba(255, 253, 249, .18);
      border-radius: var(--radius);
      background: rgba(255, 253, 249, .09);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 54px rgba(0, 0, 0, .22);
    }

    .art-card.large {
      left: 22px;
      right: 78px;
      top: 26px;
      height: 218px;
      background:
        linear-gradient(135deg, rgba(255, 253, 249, .18), rgba(255, 253, 249, .05)),
        linear-gradient(120deg, rgba(255, 138, 162, .34), rgba(117, 185, 158, .26));
    }

    .art-card.small {
      right: 26px;
      bottom: 34px;
      width: 178px;
      height: 128px;
      background:
        linear-gradient(135deg, rgba(255, 217, 165, .26), rgba(255, 253, 249, .08));
    }

    .art-card.strip {
      left: 38px;
      bottom: 46px;
      width: 176px;
      height: 82px;
      background:
        linear-gradient(90deg, #ff8aa2 0 28%, #ffd9a5 28% 56%, #75b99e 56% 78%, #8ab1e6 78%);
    }

    .art-suitcase {
      position: absolute;
      left: 50%;
      top: 52px;
      width: 132px;
      height: 184px;
      border: 4px solid rgba(32, 32, 39, .64);
      border-radius: 28px;
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .28) 0 7px, transparent 7px 20px),
        linear-gradient(145deg, #ff88a0, #ffd7a1 52%, #6fba9d);
      box-shadow:
        inset 20px 0 rgba(255, 255, 255, .20),
        inset -18px 0 rgba(32, 32, 39, .08),
        0 30px 60px rgba(0, 0, 0, .30);
      transform: translateX(-50%) rotate(-4deg);
      z-index: 2;
    }

    .art-suitcase::before {
      content: "";
      position: absolute;
      left: 34px;
      top: -32px;
      width: 56px;
      height: 30px;
      border: 5px solid rgba(255, 253, 249, .78);
      border-bottom: 0;
      border-radius: 18px 18px 0 0;
    }

    .art-suitcase::after {
      content: "";
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: -15px;
      height: 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .28);
      filter: blur(1px);
    }

    .art-line {
      position: absolute;
      height: 2px;
      border-radius: 999px;
      background: rgba(255, 253, 249, .26);
    }

    .art-line.one {
      left: 42px;
      right: 62px;
      top: 278px;
    }

    .art-line.two {
      left: 116px;
      right: 42px;
      top: 294px;
    }

    .art-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #fffdf9;
      opacity: .72;
    }

    .art-dot.one {
      left: 42px;
      top: 34px;
    }

    .art-dot.two {
      right: 58px;
      top: 242px;
    }

    .art-dot.three {
      left: 236px;
      bottom: 42px;
    }

    .global-strip {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .global-card {
      min-height: 124px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 10px 30px rgba(55, 39, 23, .06);
    }

    .global-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 18px;
    }

    .global-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .global-card.hot {
      border-color: rgba(221, 77, 92, .34);
      background: #fff6f2;
    }

    .workspace {
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .side {
      position: sticky;
      top: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 249, .92);
      box-shadow: 0 10px 30px rgba(55, 39, 23, .07);
      overflow: hidden;
    }

    .side-head {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: #fff9f0;
    }

    .side-head strong {
      display: block;
      font-size: 17px;
    }

    .side-head span {
      color: var(--muted);
      font-size: 13px;
    }

    .search-wrap {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .search-wrap input {
      width: 100%;
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    .search-wrap input:focus {
      border-color: rgba(221, 77, 92, .60);
      box-shadow: 0 0 0 3px rgba(221, 77, 92, .12);
    }

    .nav {
      display: grid;
      gap: 6px;
      padding: 10px;
    }

    .nav button {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      min-height: 58px;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .nav button:hover,
    .nav button.active {
      border-color: rgba(221, 77, 92, .20);
      background: #fff3ee;
    }

    .nav button.active {
      box-shadow: inset 3px 0 0 var(--red);
    }

    .nav-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #f0e7df;
      color: var(--rose);
      font-weight: 850;
    }

    .nav-title {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 800;
    }

    .nav-sub {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-count {
      color: var(--muted);
      font-size: 12px;
    }

    .content {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 249, .94);
      box-shadow: 0 12px 36px rgba(55, 39, 23, .07);
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: #fff9f0;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
      font-weight: 750;
    }

    .tool-btn:hover {
      border-color: rgba(65, 108, 159, .40);
      background: #f7fbff;
    }

    .progress {
      min-width: 220px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .bar {
      height: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: #eadfd5;
    }

    .bar span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--red), var(--green));
      transition: width .2s ease;
    }

    .playbook {
      padding: 24px;
    }

    .playbook-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      margin-bottom: 18px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .fit-box {
      width: min(280px, 100%);
      padding: 14px;
      border: 1px solid rgba(72, 126, 102, .28);
      border-radius: var(--radius);
      background: #f3fbf5;
    }

    .fit-box b {
      display: block;
      color: var(--green);
      margin-bottom: 4px;
    }

    .fit-box span {
      color: #4f665d;
      font-size: 13px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 24px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 4px 10px;
      border: 1px solid #e7ded5;
      border-radius: 999px;
      background: #fff;
      color: #5a5560;
      font-size: 13px;
      font-weight: 700;
    }

    .section-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
    }

    .section-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
    }

    .section-card.full {
      grid-column: 1 / -1;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 54px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fffaf4;
    }

    .section-title h3 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .section-title span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .items {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .item {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 10px;
      padding: 13px 16px;
      border-bottom: 1px solid #f0e8df;
    }

    .item:last-child { border-bottom: 0; }

    .item input {
      appearance: none;
      width: 22px;
      height: 22px;
      margin: 2px 0 0;
      border: 2px solid #d8c7b8;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }

    .item input:checked {
      border-color: var(--green);
      background:
        linear-gradient(135deg, transparent 42%, #fff 42% 58%, transparent 58%),
        linear-gradient(45deg, transparent 50%, #fff 50% 64%, transparent 64%),
        var(--green);
    }

    .item label {
      cursor: pointer;
    }

    .item input:checked + label {
      color: #6e6a72;
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    .avoid .section-title {
      background: #fff4f5;
    }

    .avoid .section-title h3 {
      color: var(--rose);
    }

    .check .section-title {
      background: #f2f8ff;
    }

    .check .section-title h3 {
      color: var(--blue);
    }

    mark {
      padding: 1px 4px;
      border-radius: 4px;
      background: #fff0a8;
      color: inherit;
    }

    .empty {
      padding: 18px 16px;
      color: var(--muted);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      padding: 10px 14px;
      border: 1px solid rgba(72, 126, 102, .28);
      border-radius: var(--radius);
      background: #f3fbf5;
      color: var(--green);
      opacity: 0;
      pointer-events: none;
      box-shadow: var(--shadow);
      transition: opacity .18s ease, transform .18s ease;
      font-weight: 750;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1060px) {
      .hero,
      .workspace {
        grid-template-columns: 1fr;
      }

      .side {
        position: relative;
        top: auto;
      }

      .nav {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .visual-panel {
        min-height: 230px;
      }

      .hero-art {
        min-height: 278px;
      }
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100vw - 20px, 1360px);
        padding-top: 10px;
      }

      .hero-copy,
      .playbook {
        padding: 20px;
      }

      .hero-metrics,
      .global-strip,
      .section-grid,
      .playbook-head {
        grid-template-columns: 1fr;
      }

      .nav {
        grid-template-columns: 1fr;
      }

      .toolbar {
        align-items: stretch;
      }

      .toolbar-actions,
      .progress {
        width: 100%;
      }

      .tool-btn {
        flex: 1;
      }

      .visual-panel {
        min-height: 280px;
      }

      .hero-art {
        min-height: 238px;
      }

      .art-card.large {
        left: 12px;
        right: 46px;
        top: 18px;
        height: 156px;
      }

      .art-card.strip {
        left: 24px;
        bottom: 28px;
      }

      .art-card.small {
        right: 16px;
        bottom: 24px;
        width: 138px;
        height: 92px;
      }

      .art-suitcase {
        top: 42px;
        width: 104px;
        height: 142px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <div class="eyebrow">报备笔记优化手册</div>
        <h1 id="page-title">DTA 小红书合作笔记 Checklist</h1>
        <p class="lead">选择笔记类型后，团队可以直接查看对应的内容优化点、合作避雷点和发布前确认项。重点围绕行李箱的颜值、出片、容量、场景真实感和光线质感。</p>
        <div class="hero-metrics" aria-label="清单概览">
          <div class="metric"><strong>7</strong><span>种笔记类型</span></div>
          <div class="metric"><strong>51</strong><span>条优化经验</span></div>
          <div class="metric"><strong>22</strong><span>条避雷提醒</span></div>
        </div>
      </div>
      <div class="visual-panel" aria-hidden="true">
        <div class="hero-art">
          <div class="art-card large"></div>
          <div class="art-card strip"></div>
          <div class="art-card small"></div>
          <div class="art-suitcase"></div>
          <div class="art-line one"></div>
          <div class="art-line two"></div>
          <div class="art-dot one"></div>
          <div class="art-dot two"></div>
          <div class="art-dot three"></div>
        </div>
      </div>
    </section>

    <section class="global-strip" aria-label="全局必看">
      <article class="global-card hot">
        <strong>光线是第一优先级</strong>
        <p>任何类型都要保证箱子纹路清晰，避免偏暗、过曝、背光和明显色差。</p>
      </article>
      <article class="global-card">
        <strong>关键词要自然埋入</strong>
        <p>标题、封面、正文和花字围绕出片、大容量、DTA 行李箱、DTA 腰果箱、旅行、高颜值、巨能装等核心词。</p>
      </article>
    </section>

    <section class="workspace">
      <aside class="side" aria-label="笔记类型选择">
        <div class="side-head">
          <strong>选择合作笔记类型</strong>
          <span>适合报备前沟通和出稿前复核</span>
        </div>
        <div class="search-wrap">
          <input id="search" type="search" placeholder="搜索：光线、封面、口播、收纳..." aria-label="搜索清单内容">
        </div>
        <nav id="nav" class="nav"></nav>
      </aside>

      <section class="content" aria-live="polite">

    const state = {
      activeId: playbooks[0].id,
      query: ""
    };

    const els = {
      nav: document.getElementById("nav"),
      playbook: document.getElementById("playbook"),
      search: document.getElementById("search"),
      progressText: document.getElementById("progressText"),
      progressCount: document.getElementById("progressCount"),
      progressBar: document.getElementById("progressBar"),
      copyBtn: document.getElementById("copyBtn"),
      resetBtn: document.getElementById("resetBtn"),
      toast: document.getElementById("toast")
    };

    function storageKey(id) {
      return `dta-xhs-checklist-${id}`;
    }

    function getChecked(id) {
      try {
        return new Set(JSON.parse(localStorage.getItem(storageKey(id))) || []);
      } catch (_) {
        return new Set();
      }
    }

    function setChecked(id, checkedSet) {
      localStorage.setItem(storageKey(id), JSON.stringify([...checkedSet]));
    }

    function activePlaybook() {
      return playbooks.find(item => item.id === state.activeId) || playbooks[0];
    }

    function highlight(text) {
      const q = state.query.trim();
      if (!q) return escapeHtml(text);
      const parts = escapeHtml(text).split(new RegExp(`(${escapeRegExp(q)})`, "gi"));
      return parts.map(part => part.toLowerCase() === q.toLowerCase() ? `<mark>${part}</mark>` : part).join("");
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeRegExp(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function matchesQuery(item) {
      const q = state.query.trim().toLowerCase();
      if (!q) return true;
      const haystack = [
        item.title,
        item.sub,
        item.fit,
        ...item.tags,
        ...item.optimize,
        ...item.avoid,
        ...item.checks
      ].join(" ").toLowerCase();
      return haystack.includes(q);
    }

    function renderNav() {
      const visible = playbooks.filter(matchesQuery);
      els.nav.innerHTML = visible.map(item => `
        <button type="button" class="${item.id === state.activeId ? "active" : ""}" data-id="${item.id}">
          <span class="nav-icon">${escapeHtml(item.icon)}</span>
          <span>
            <span class="nav-title">${highlight(item.title)}</span>
            <span class="nav-sub">${highlight(item.tags.slice(0, 2).join(" / "))}</span>
          </span>
          <span class="nav-count">${item.optimize.length + item.avoid.length}</span>
        </button>
      `).join("");

      if (!visible.some(item => item.id === state.activeId) && visible[0]) {
        state.activeId = visible[0].id;
        render();
        return;
      }

      els.nav.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          state.activeId = button.dataset.id;
          render();
        });
      });
    }

    function itemList(type, items) {
      if (!items.length) {
        return `<div class="empty">这一类目前没有单独避雷项，执行全局避雷：光线、真实场景、关键词、节奏和色差。</div>`;
      }

      const checked = getChecked(state.activeId);
      return `<ul class="items">${items.map((text, index) => {
        const key = `${type}-${index}`;
        return `
          <li class="item">
            <input id="${key}" type="checkbox" data-key="${key}" ${checked.has(key) ? "checked" : ""}>
            <label for="${key}">${highlight(text)}</label>
          </li>
        `;
      }).join("")}</ul>`;
    }

    function renderPlaybook() {
      const item = activePlaybook();
      els.playbook.innerHTML = `
        <div class="playbook-head">
          <div>
            <h2>${highlight(item.title)}</h2>
            <p class="subtitle">${highlight(item.sub)}</p>
          </div>
          <div class="fit-box">
            <b>适合合作</b>
            <span>${highlight(item.fit)}</span>
          </div>
        </div>
        <div class="chips">${item.tags.map(tag => `<span class="chip">${highlight(tag)}</span>`).join("")}</div>
        <div class="section-grid">
          <article class="section-card">
            <div class="section-title">
              <h3>内容优化点</h3>
              <span>${item.optimize.length} 项</span>
            </div>
            ${itemList("optimize", item.optimize)}
          </article>
          <article class="section-card avoid">
            <div class="section-title">
              <h3>内容避雷点</h3>
              <span>${item.avoid.length} 项</span>
            </div>
            ${itemList("avoid", item.avoid)}
          </article>
          <article class="section-card check full">
            <div class="section-title">
              <h3>发布前确认</h3>
              <span>${item.checks.length} 项</span>
            </div>
            ${itemList("checks", item.checks)}
          </article>
        </div>
      `;

      els.playbook.querySelectorAll("input[type='checkbox']").forEach(box => {
        box.addEventListener("change", () => {
          const checked = getChecked(state.activeId);
          if (box.checked) checked.add(box.dataset.key);
          else checked.delete(box.dataset.key);
          setChecked(state.activeId, checked);
          updateProgress();
        });
      });
    }

    function updateProgress() {
      const item = activePlaybook();
      const total = item.optimize.length + item.avoid.length + item.checks.length;
      const checked = [...getChecked(item.id)].filter(key => {
        const [type, rawIndex] = key.split("-");
        const index = Number(rawIndex);
        return item[type] && item[type][index];
      }).length;
      const percent = total ? Math.round((checked / total) * 100) : 0;
      els.progressText.textContent = percent === 100 ? "已全部确认" : percent > 0 ? `已确认 ${percent}%` : "未勾选";
      els.progressCount.textContent = `${checked}/${total}`;
      els.progressBar.style.width = `${percent}%`;
    }

    function copyCurrent() {
      const item = activePlaybook();
      const lines = [
        `【${item.title}】小红书报备笔记 Checklist`,
        "",
        `适合合作：${item.fit}`,
        `关键词：${item.tags.join(" / ")}`,
        "",
        "内容优化点：",
        ...item.optimize.map((text, index) => `${index + 1}. ${text}`),
        "",
        "内容避雷点：",
        ...(item.avoid.length ? item.avoid.map((text, index) => `${index + 1}. ${text}`) : ["暂无专属避雷，执行全局避雷。"]),
        "",
        "发布前确认：",
        ...item.checks.map((text, index) => `${index + 1}. ${text}`)
      ];
      copyText(lines.join("\n")).then(
        () => showToast("已复制当前清单"),
        () => showToast("复制失败，可手动选择页面文字")
      );
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }

      return new Promise((resolve, reject) => {
        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.left = "-9999px";
        document.body.appendChild(area);
        area.select();
        try {
          document.execCommand("copy") ? resolve() : reject(new Error("copy failed"));
        } catch (error) {
          reject(error);
        } finally {
          document.body.removeChild(area);
        }
      });
    }

    function resetCurrent() {
      localStorage.removeItem(storageKey(state.activeId));
      renderPlaybook();
      updateProgress();
      showToast("已清空当前勾选");
    }

    function showToast(text) {
      els.toast.textContent = text;
      els.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 1800);
    }

    function render() {
      renderNav();
      renderPlaybook();
      updateProgress();
    }

    els.search.addEventListener("input", event => {
      state.query = event.target.value;
      render();
    });
    els.copyBtn.addEventListener("click", copyCurrent);
    els.resetBtn.addEventListener("click", resetCurrent);

    render();
  </script>
</body>
</html>
